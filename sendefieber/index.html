<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14142a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Sendefieber</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-l"><b id="h-day">Tag 1</b><span id="h-time">05:30</span></div>
    <div class="hud-m"><b id="h-money">0 DM</b><span id="h-sub">Ruf 30</span></div>
    <div class="hud-r">
      <button data-speed="0" aria-label="Pause">II</button>
      <button data-speed="1" aria-label="Normal">&gt;</button>
      <button data-speed="3" aria-label="Schnell">&gt;&gt;</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="scene" width="180" height="320"></canvas>
    <section id="room" hidden></section>
  </main>
  <footer id="ticker"><div id="t-next"></div><div id="t-msg"></div></footer>
  <div id="modal" hidden></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
